<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f5f7fb; }
        .edit-container { max-width: 900px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 30px; font-weight: 600; }
        .form-label { font-weight: 500; }
    </style>
</head>
<body>
<div class="edit-container">
    <h2>Edit Student</h2>

    <form method="POST" action="{{ url_for('edit_student', id=student.id) }}">
        <div class="row">
            <!-- Student Name -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
            </div>

            <!-- Email -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
            </div>

            <!-- Roll Number -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text" name="roll_number" class="form-control" value="{{ student.roll_number }}" required>
            </div>

            <!-- Phone -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" class="form-control" value="{{ student.phone }}" required>
            </div>

            <!-- Department -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Department</label>
                <select name="department" class="form-select" required>
                    <option value="CSE" {% if student.department == "CSE" %}selected{% endif %}>CSE</option>
                    <option value="ECE" {% if student.department == "ECE" %}selected{% endif %}>ECE</option>
                    <option value="EEE" {% if student.department == "EEE" %}selected{% endif %}>EEE</option>
                    <option value="MECH" {% if student.department == "MECH" %}selected{% endif %}>MECH</option>
                    <option value="CIVIL" {% if student.department == "CIVIL" %}selected{% endif %}>CIVIL</option>
                    <option value="ARCH" {% if student.department == "ARCH" %}selected{% endif %}>ARCH</option>
                </select>
            </div>

            <!-- Year -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Year</label>
                <select name="year" class="form-select" required>
                    <option value="1st Year" {% if student.year == "1st Year" %}selected{% endif %}>1st Year</option>
                    <option value="2nd Year" {% if student.year == "2nd Year" %}selected{% endif %}>2nd Year</option>
                    <option value="3rd Year" {% if student.year == "3rd Year" %}selected{% endif %}>3rd Year</option>
                    <option value="4th Year" {% if student.year == "4th Year" %}selected{% endif %}>4th Year</option>
                </select>
            </div>

            <!-- Marks -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Marks</label>
                <input type="number" name="marks" class="form-control" value="{{ student.marks }}" min="0" max="100" step="0.1" required>
            </div>

            <!-- Attendance -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Attendance %</label>
                <input type="number" name="attendance" class="form-control" value="{{ student.attendance }}" min="0" max="100" step="0.1" required>
            </div>
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-primary">Update Student</button>
        <a href="{{ url_for('students_list') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
