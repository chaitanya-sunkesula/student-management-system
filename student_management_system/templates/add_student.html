<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Student</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f5f7fb; }
    .student-container { max-width: 900px; margin: 50px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-bottom: 30px; font-weight: 600; }
    .form-label { font-weight: 500; }
  </style>
</head>
<body>
<div class="student-container">
  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Add Student</h2>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Dashboard</a>
  </div>

  <!-- FORM -->
  <form method="POST" action="{{ url_for('add_student') }}">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Student Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Roll Number</label>
        <input type="text" name="roll_number" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Phone</label>
        <input type="tel" name="phone" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Department</label>
        <select name="department" class="form-select" required>
          <option value="">Select Department</option>
          <option>CSE</option>
          <option>ECE</option>
          <option>EEE</option>
          <option>MECH</option>
          <option>CIVIL</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Year</label>
        <select name="year" class="form-select" required>
          <option value="">Select Year</option>
          <option>1st Year</option>
          <option>2nd Year</option>
          <option>3rd Year</option>
          <option>4th Year</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Marks</label>
        <input type="number" name="marks" class="form-control" min="0" max="100" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Attendance %</label>
        <input type="number" name="attendance" class="form-control" min="0" max="100" required>
      </div>
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-success">Add Student</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
    </div>
  </form>
</div>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
